plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.eformworks.signstage'
version = '0.0.1-SNAPSHOT'

ext {
	// querydsl/querydsl 프로젝트는 5.1.0 이후 유지보수가 중단됐다. Spring Data 공식 문서가 안내하는
	// OpenFeign 포크(jakarta 네임스페이스/Hibernate 7 지원)를 사용한다.
	queryDslVersion = '7.5'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'

	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	implementation "io.github.openfeign.querydsl:querydsl-core:${queryDslVersion}"
	implementation "io.github.openfeign.querydsl:querydsl-jpa:${queryDslVersion}"
	annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${queryDslVersion}:jpa"

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('hashPassword', JavaExec) {
	group = 'signstage'
	description = 'DB 시딩용 BCrypt 해시를 생성한다. 사용: ./gradlew hashPassword --console=plain (표준입력) 또는 --args="평문비밀번호"'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.eformworks.signstage.backend.core.tool.PasswordHashCli'
	standardInput = System.in
}

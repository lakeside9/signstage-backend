spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:new_signstage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:app_user2}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # 로컬 전용 기본값이다. dev/stage/prd는 JWT_SECRET 환경변수로 반드시 덮어써야 하며
  # 기본값 없이(필수값으로) 구성한다.
  secret: ${JWT_SECRET:signstage-local-dev-only-jwt-secret-do-not-use-in-real-envs}
  platform-token-expiry-minutes: ${JWT_PLATFORM_TOKEN_EXPIRY_MINUTES:60}
  user-token-expiry-minutes: ${JWT_USER_TOKEN_EXPIRY_MINUTES:480}
  password-reset-token-expiry-minutes: ${JWT_PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operations-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.eformworks.signstage.backend: DEBUG
    org.hibernate.SQL: DEBUG

server:
  port: ${SERVER_PORT:8050}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:new_signstage}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:app_user2}
    password: ${DB_PASSWORD:app_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

storage:
  local:
    base-dir: ${STORAGE_LOCAL_BASE_DIR:./data/uploads}

jwt:
  # 로컬 전용 기본값이다. dev/stage/prd는 JWT_SECRET 환경변수로 반드시 덮어써야 하며
  # 기본값 없이(필수값으로) 구성한다.
  secret: ${JWT_SECRET:signstage-local-dev-only-jwt-secret-do-not-use-in-real-envs}
  platform-token-expiry-minutes: ${JWT_PLATFORM_TOKEN_EXPIRY_MINUTES:60}
  user-token-expiry-minutes: ${JWT_USER_TOKEN_EXPIRY_MINUTES:480}
  password-reset-token-expiry-minutes: ${JWT_PASSWORD_RESET_TOKEN_EXPIRY_MINUTES:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operations-sorter: alpha
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

logging:
  level:
    com.eformworks.signstage.backend: DEBUG
    org.hibernate.SQL: DEBUG
  # 콘솔에는 SQL 로그가 워낙 많이 흘러 지나가 WARN/ERROR를 놓치기 쉽다 — 콘솔 출력은
  # 그대로 두고 같은 내용을 파일에도 남겨 재시작 후에도 grep으로 다시 찾아볼 수 있게 한다.
  # Spring Boot 기본 rolling 정책(10MB/파일, 최근 것 위주 보관)을 그대로 쓴다.
  file:
    name: ./logs/signstage-backend.log
